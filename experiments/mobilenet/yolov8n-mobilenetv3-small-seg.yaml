# MobileNetV3-Small feature stages follow the two audited repository layouts.
# Reuse installed torchvision and Ultralytics 8.3.221: no parser patch required.
# All weights are random; this is NOT a trained segmentation model.
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # Drop final classification expansion, average pool and classifier (truncate=3).
  # split output includes input at index 0, so features[3,8,11] -> [4,9,12].
  - [-1, 1, TorchVision, [96, mobilenet_v3_small, null, True, 3, True]] # 0
  - [0, 1, Index, [24, 4]]  # 1: P3, stride 8
  - [-1, 1, Conv, [256, 1, 1]] # 2: 24 -> 64 (n width=0.25)
  - [0, 1, Index, [48, 9]]  # 3: P4, stride 16
  - [-1, 1, Conv, [512, 1, 1]] # 4: 48 -> 128
  - [0, 1, Index, [96, 12]] # 5: P5, stride 32
  - [-1, 1, Conv, [1024, 1, 1]] # 6: 96 -> 256
  - [-1, 1, SPPF, [1024, 5]] # 7: same SPPF as YOLOv8n-seg

# Exactly the official YOLOv8n-seg neck and Segment head, with renumbered sources.
head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 8
  - [[-1, 4], 1, Concat, [1]] # 9
  - [-1, 3, C2f, [512]] # 10
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 11
  - [[-1, 2], 1, Concat, [1]] # 12
  - [-1, 3, C2f, [256]] # 13: P3
  - [-1, 1, Conv, [256, 3, 2]] # 14
  - [[-1, 10], 1, Concat, [1]] # 15
  - [-1, 3, C2f, [512]] # 16: P4
  - [-1, 1, Conv, [512, 3, 2]] # 17
  - [[-1, 7], 1, Concat, [1]] # 18
  - [-1, 3, C2f, [1024]] # 19: P5
  - [[13, 16, 19], 1, Segment, [nc, 32, 256]] # 20
